name: backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etp-core/etp-backend

    steps:
      - uses: actions/checkout@v6
      - name: Prepare java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.11.1.1273
      - name: Build
        run: clojure -M:uberjar

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etp-core/etp-backend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.11.1.1273
      - name: Lint
        run: clojure -M:lint --fail-level error
      - name: Lint changed files (warnings)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -t files < <(git diff --relative --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- src | grep -E '\.clj[cs]?$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Clojure files to lint"
          else
            clojure -M:lint-changed "${files[@]}"
          fi

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Prepare java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13
        with:
          cli: 1.11.1.1273
      - name: Install Libreoffice
        run: sudo apt-get update && sudo apt-get install libreoffice
      - name: Docker Compose
        working-directory: etp-core/docker
        run: ./start.sh
      - name: Test
        working-directory: etp-core/etp-backend
        run: clojure -M:dev:test-ci
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
         report_paths: '**/etp-core/etp-backend/target/test.xml'
         check_name: 'Backend test report'